<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', monospace; fill: #c9d1d9; }
  </style>
  <rect width="100%" height="100%" fill="#0d1117" rx="6" />
  <text x="85" y="40" text-anchor="middle" font-size="11" fill="#484f58">Current Streak</text>
  <text x="85" y="78" text-anchor="middle" font-size="32" font-weight="bold" fill="#58a6ff">1</text>

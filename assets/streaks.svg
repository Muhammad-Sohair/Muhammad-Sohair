  <line x1="170" y1="20" x2="170" y2="100" stroke="#484f58" stroke-width="0.5" />
  <text x="255" y="40" text-anchor="middle" font-size="11" fill="#484f58">Longest Streak</text>
  <text x="255" y="78" text-anchor="middle" font-size="32" font-weight="bold" fill="#c9d1d9">2</text>
